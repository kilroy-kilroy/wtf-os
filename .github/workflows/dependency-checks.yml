name: Dependency checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependency-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the shared lockfile
        run: npm ci
      - name: Type-check web and imported packages
        run: npm run type-check --workspace=web
      - name: Test web
        run: npm test --workspace=web
      - name: Test shared utilities
        run: npm test --workspace=@repo/utils
